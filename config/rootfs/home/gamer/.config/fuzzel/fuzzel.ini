[main]
# The panel is 640x480 on a ~3.5" display, so its physical DPI is ~200: a point-sized font
# (size=9) renders ~25 px tall here and the launcher grows wider than the screen. pixelsize is
# DPI-independent, which is what this panel needs.
# Only classic keys are used — fuzzel 1.12 refuses to start on an unknown key, and [dmenu] does
# not accept font/lines/width at all.
font=DejaVu Sans:pixelsize=12
lines=6
width=30
terminal=foot
