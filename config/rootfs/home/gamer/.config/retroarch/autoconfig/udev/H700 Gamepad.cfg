input_driver = "udev"
input_device = "H700 Gamepad"
input_vendor_id = "18507"
input_product_id = "5343"
# Indices are RetroArch's evdev button order (ascending evdev code from BTN_MISC on):
# 0 BTN_SOUTH, 1 BTN_EAST, 2 BTN_NORTH, 3 BTN_WEST, 4 BTN_TL, 5 BTN_TR, 6 BTN_TL2, 7 BTN_TR2,
# 8 BTN_SELECT, 9 BTN_START, 10 BTN_MODE, 11 BTN_THUMBL, 12 BTN_THUMBR,
# 13 BTN_DPAD_UP, 14 BTN_DPAD_DOWN, 15 BTN_DPAD_LEFT, 16 BTN_DPAD_RIGHT.
# The H700 DTS labels BTN_EAST as "A" and BTN_SOUTH as "B" (SNES-style face), so RetroPad A is
# index 1, not 0 — the same choice ROCKNIX ships for this pad.
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
