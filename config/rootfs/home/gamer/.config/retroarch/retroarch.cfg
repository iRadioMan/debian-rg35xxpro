# RetroArch (Debian trixie 1.20.x) for the H700: KMS/DRM + GLES2, 640x480, 1 GiB RAM.
# Debian builds RetroArch with HAVE_KMS=auto, so the kms context driver talks to
# /dev/dri/card1 (sun4i-drm) directly; "gl" on an arm64 build is GLES.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
video_aspect_ratio_auto = "true"
audio_driver = "pulse"
menu_driver = "ozone"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
joypad_autoconfig_dir = "/home/gamer/.config/retroarch/autoconfig"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
savefile_directory = "/home/gamer/.config/retroarch/savefiles"
savestate_directory = "/home/gamer/.config/retroarch/savestates"
screenshot_directory = "/home/gamer/.config/retroarch/screenshots"
system_directory = "/home/gamer/.config/retroarch/system"
# Do not let RetroArch write a per-launch log to the SD card.
log_to_file = "false"
