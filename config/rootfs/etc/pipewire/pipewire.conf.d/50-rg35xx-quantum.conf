# The H616 codec runs at 48 kHz. PipeWire allows clients to pull the graph down
# to 32 frames, and pulse clients default to 128 frames (2.7 ms). FAudio/SDL2
# games mix in 1024-frame blocks; at 128 frames the VVVVVV mixer periodically
# misses the deadline and is heard as a click several times per second.
# Keep at least 1024 frames (21 ms) so a game-sized mix block always fits.
context.properties = {
    default.clock.min-quantum = 1024
}
