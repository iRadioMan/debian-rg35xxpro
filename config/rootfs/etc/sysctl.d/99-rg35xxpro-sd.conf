# Flash wear: let dirty pages accumulate and be written in larger, less frequent bursts
# (1.5 s..3 s writeback timers, background flush at 10 % of RAM). Paired with commit=120 in
# /etc/fstab this costs at most ~2 minutes of data on a hard power-off, which is the accepted
# "balanced" trade-off for this handheld.
vm.dirty_writeback_centisecs=1500
vm.dirty_expire_centisecs=3000
vm.dirty_background_ratio=10
vm.dirty_ratio=20
