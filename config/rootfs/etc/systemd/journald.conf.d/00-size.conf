# The journal lives on the SD card, not in RAM: it survives a hard power-off, which is what
# these handhelds do. Cap it hard so logs cannot eat the card (a full journal is the largest
# idle writer on the device).
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=8M
RuntimeMaxUse=16M
MaxRetentionSec=1week
SyncIntervalSec=5m
