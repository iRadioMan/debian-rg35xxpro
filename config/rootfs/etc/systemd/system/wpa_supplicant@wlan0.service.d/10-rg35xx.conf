[Unit]
# wlan0 is created by the rtw88 driver after the firmware loads, which happens well after
# multi-user starts. Without this ordering wpa_supplicant@wlan0 races the driver, exits with
# "Failed to initialize interface wlan0", and nothing ever retries — Wi-Fi then looks dead while
# the config is perfectly fine.
After=sys-subsystem-net-devices-wlan0.device rg35xx-wifi-unblock.service
Wants=sys-subsystem-net-devices-wlan0.device
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=3
