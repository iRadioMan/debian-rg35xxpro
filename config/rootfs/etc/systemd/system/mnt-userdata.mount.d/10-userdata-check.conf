[Unit]
# Generated mnt-userdata.mount has x-systemd.requires=rg35xx-userdata.service from fstab; this
# drop-in adds the repair step for manual starts too. The service itself is Before= the mount, so
# fsck only ever sees an unmounted partition.
Requires=rg35xx-userdata-check.service
After=rg35xx-userdata-check.service
