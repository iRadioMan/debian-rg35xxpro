# Session state shared by the mode switcher and its ExecStopPost helpers. tmpfs, so it never
# touches the SD card and cannot go stale across a reboot.
d /run/rg35xx 0775 root gamer -
# Mount point for the user-data partition. The partition itself is created on first boot
# (rg35xx-userdata.service); when it is missing or the mount fails, /roms stays an empty directory
# instead of a dangling path — and because ES-DE creates its system directories there, gamer has to
# be able to write to it.
d /roms 0775 root gamer -
# XDG_RUNTIME_DIR for the session user. logind creates it too, but with linger the user manager
# can be started before that and then fails with "Failed to allocate manager object: Permission
# denied" (no runtime dir it is allowed to create itself).
d /run/user/1000 0700 gamer gamer -
